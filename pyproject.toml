[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]
extend-exclude = [
    ".git",
    ".venv",
    ".pytest_cache",
    "build",
    "dist",
    "data/genration_script",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["config", "dags", "etl", "monitoring", "scripts", "src", "validation"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "N806"]
"tests/dag_integrity/*.py" = ["E402"]
"tests/integration/test_reliability.py" = ["E402"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: fast, dependency-light rule and contract tests",
    "dag_integrity: Airflow DagBag import, graph, retry, and tag checks",
    "integration: requires PostgreSQL and exercises the end-to-end pipeline",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["config", "etl", "validation", "monitoring", "src"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install ruff
        run: python -m pip install "ruff==0.7.4"
      - name: Ruff lint
        run: ruff check config etl validation dags monitoring tests
      - name: Ruff format check
        run: ruff format --check config etl validation dags monitoring tests

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: pytest tests/unit -m unit --cov=config --cov=etl --cov=validation --cov=monitoring --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage.xml
          if-no-files-found: ignore

  dag-integrity:
    name: DagBag integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify DAG imports, graph, retries, and tags
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow-home
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
          AIRFLOW__CORE__UNIT_TEST_MODE: "True"
        run: pytest tests/dag_integrity -m dag_integrity

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: obsiflow
          POSTGRES_PASSWORD: obsiflow
          POSTGRES_DB: obsiflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U obsiflow -d obsiflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OBSIFLOW_ENVIRONMENT: test
      OBSIFLOW_POSTGRES_HOST: localhost
      OBSIFLOW_POSTGRES_PORT: "5432"
      OBSIFLOW_POSTGRES_DB: obsiflow
      OBSIFLOW_POSTGRES_USER: obsiflow
      OBSIFLOW_POSTGRES_PASSWORD: obsiflow
      OBSIFLOW_REQUIRE_DB: "1"
      AIRFLOW_HOME: ${{ runner.temp }}/airflow-home
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__UNIT_TEST_MODE: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply PostgreSQL schema
        env:
          PGPASSWORD: obsiflow
        run: psql -h localhost -U obsiflow -d obsiflow -v ON_ERROR_STOP=1 -f db/init.sql
      - name: Run integration tests
        run: pytest tests/integration -m integration --cov=config --cov=etl --cov=validation --cov=monitoring --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-coverage
          path: coverage.xml
          if-no-files-found: ignore

  compose:
    name: Docker Compose check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Assert required services
        run: |
          services="$(docker compose config --services | sort)"
          echo "$services"
          for required in postgres airflow-init airflow-webserver airflow-scheduler metrics-exporter prometheus grafana; do
            echo "$services" | grep -qx "$required"
          done

  ci-success:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [lint, unit, dag-integrity, integration, compose]
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        run: |
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.unit.result }}" = "success"
          test "${{ needs['dag-integrity'].result }}" = "success"
          test "${{ needs.integration.result }}" = "success"
          test "${{ needs.compose.result }}" = "success"

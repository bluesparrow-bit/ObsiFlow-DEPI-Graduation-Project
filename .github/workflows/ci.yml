name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  repo-hygiene:
    name: Repository hygiene & secret check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run repository hygiene audit
        run: python scripts/check_hygiene.py

  config-validation:
    name: Configuration & schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install "PyYAML==6.0.2" "pydantic==2.9.2" "pydantic-settings==2.6.1"
      - name: Validate all YAML documents
        run: |
          python - << 'EOF'
          import sys
          from pathlib import Path
          import yaml

          yaml_files = [
              p for p in Path(".").rglob("*")
              if p.suffix in {".yaml", ".yml"}
              and not any(part.startswith(".") for part in p.parts if part not in {".github"})
          ]
          print(f"Validating {len(yaml_files)} YAML files...")
          for yml in yaml_files:
              try:
                  list(yaml.safe_load_all(yml.read_text(encoding="utf-8")))
              except Exception as exc:
                  print(f"FAILED: {yml}: {exc}", file=sys.stderr)
                  sys.exit(1)
          print("All YAML documents are syntactically valid.")
          EOF
      - name: Validate SQL schema definitions
        run: |
          python - << 'EOF'
          import sys
          from pathlib import Path

          sql_path = Path("db/init.sql")
          if not sql_path.exists():
              print("ERROR: db/init.sql missing!", file=sys.stderr)
              sys.exit(1)
          sql = sql_path.read_text(encoding="utf-8").lower()
          required_tables = [
              "reference.accounts",
              "target.transactions",
              "quality.error_records",
              "observability.pipeline_runs",
          ]
          for t in required_tables:
              if f"create table if not exists {t}" not in sql:
                  print(f"ERROR: missing DDL for table {t}", file=sys.stderr)
                  sys.exit(1)
          print("SQL schema definitions validated successfully.")
          EOF
      - name: Test data generator determinism
        run: |
          # 1. Run twice with identical seed -> outputs must match byte-for-byte
          python data/genration_script/generate_data.py --out /tmp/gen_seed42_a --rows 1000 --seed 42
          python data/genration_script/generate_data.py --out /tmp/gen_seed42_b --rows 1000 --seed 42
          diff -r /tmp/gen_seed42_a /tmp/gen_seed42_b
          echo "Determinism verified: identical seeds produce identical output."

          # 2. Run with different seed -> output must diverge
          python data/genration_script/generate_data.py --out /tmp/gen_seed99 --rows 1000 --seed 99
          if cmp -s /tmp/gen_seed42_a/batches/transactions_clean_1000.csv /tmp/gen_seed99/batches/transactions_clean_1000.csv; then
            echo "ERROR: Generator produced identical output with different seeds!"
            exit 1
          fi
          echo "Seed variation verified: different seeds produce distinct output."

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install ruff
        run: python -m pip install "ruff==0.7.4"
      - name: Ruff lint
        run: ruff check config etl validation dags monitoring tests src scripts
      - name: Ruff format check
        run: ruff format --check config etl validation dags monitoring tests src scripts

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests with coverage gate
        run: |
          pytest tests/unit -m unit \
            --cov=config \
            --cov=etl \
            --cov=validation \
            --cov=monitoring \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage.xml
          if-no-files-found: ignore

  dag-integrity:
    name: DagBag integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify DAG imports, graph, retries, and tags
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow-home
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
          AIRFLOW__CORE__UNIT_TEST_MODE: "True"
        run: pytest tests/dag_integrity -m dag_integrity

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: obsiflow
          POSTGRES_PASSWORD: obsiflow
          POSTGRES_DB: obsiflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U obsiflow -d obsiflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OBSIFLOW_ENVIRONMENT: test
      OBSIFLOW_POSTGRES_HOST: localhost
      OBSIFLOW_POSTGRES_PORT: "5432"
      OBSIFLOW_POSTGRES_DB: obsiflow
      OBSIFLOW_POSTGRES_USER: obsiflow
      OBSIFLOW_POSTGRES_PASSWORD: obsiflow
      OBSIFLOW_REQUIRE_DB: "1"
      AIRFLOW_HOME: ${{ github.workspace }}/airflow-home
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__UNIT_TEST_MODE: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply PostgreSQL schema
        env:
          PGPASSWORD: obsiflow
        run: psql -h localhost -U obsiflow -d obsiflow -v ON_ERROR_STOP=1 -f db/init.sql
      - name: Run integration tests
        run: pytest tests/integration -m integration --cov=config --cov=etl --cov=validation --cov=monitoring --cov=src --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-coverage
          path: coverage.xml
          if-no-files-found: ignore

  compose:
    name: Docker Compose check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Assert required services
        run: |
          services="$(docker compose config --services | sort)"
          echo "$services"
          for required in postgres airflow-init airflow-webserver airflow-scheduler metrics-exporter prometheus grafana; do
            echo "$services" | grep -qx "$required"
          done

  ci-success:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [repo-hygiene, config-validation, lint, unit, dag-integrity, integration, compose]
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        run: |
          test "${{ needs['repo-hygiene'].result }}" = "success"
          test "${{ needs['config-validation'].result }}" = "success"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.unit.result }}" = "success"
          test "${{ needs['dag-integrity'].result }}" = "success"
          test "${{ needs.integration.result }}" = "success"
          test "${{ needs.compose.result }}" = "success"

# ObsiFlow alerting rules.
#
# TODO [OB]: Implement the four required rules below.  Keep the alert names and
# severity contract stable so docs/runbook.md and Grafana links stay valid.
#
# 1. PipelineRunFailed
#    Latest run status is failed:
#    pipeline_last_run_status{status="failed"} == 1
#
# 2. PipelineStale
#    No successful run in more than 26 hours (daily schedule + 2h grace):
#    pipeline_last_success_timestamp_seconds > 0
#    and (time() - pipeline_last_success_timestamp_seconds) > 26 * 3600
#
# 3. PipelineNeverReported
#    Telemetry has never been reported:
#    absent(pipeline_last_reported_timestamp_seconds)
#    or pipeline_last_reported_timestamp_seconds == 0
#
# 4. HighRejectionRate
#    Latest run rejected more than 10% of extracted rows:
#    pipeline_rejection_rate > 0.10
#
groups:
  - name: obsiflow.pipeline
    rules: []

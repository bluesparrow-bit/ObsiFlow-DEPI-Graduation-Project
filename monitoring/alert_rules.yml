groups:
  - name: obsiflow-pipeline
    rules:
      - alert: PipelineRunFailed
        expr: pipeline_last_run_status{status="FAILED"} == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Latest ObsiFlow pipeline run FAILED"
          description: "Check observability.pipeline_runs and quality.error_records. See docs/runbook.md."

      - alert: PipelineStale
        expr: |
          pipeline_last_reported_timestamp_seconds > 0
          and (time() - pipeline_last_success_timestamp_seconds) > 26 * 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No successful pipeline run for more than 26 hours"
          description: "Last success was {{ $value | humanizeDuration }} ago."

      - alert: PipelineNeverReported
        expr: pipeline_last_reported_timestamp_seconds == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pipeline has never reported a run"
          description: "observability.pipeline_runs is empty. Trigger the DAG or check the exporter."

      - alert: HighRejectionRate
        expr: pipeline_rejection_rate > 0.10
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Rejection rate above 10%"
          description: "Latest run rejected {{ $value | humanizePercentage }} of rows."

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: obsiflow-exporter
    metrics_path: /metrics
    static_configs:
      # CHECK: must match the exporter's service name in docker-compose.yml
      - targets: ["metrics-exporter:9101"]

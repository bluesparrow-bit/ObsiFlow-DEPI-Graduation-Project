apiVersion: 1

providers:
  - name: ObsiFlow
    orgId: 1
    folder: ObsiFlow
    folderUid: obsiflow
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
